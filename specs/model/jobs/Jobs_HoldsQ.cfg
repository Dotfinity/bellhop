\* Holds run with queue pause / maintenance on and MaxAttempts = 1 (Jobs_Holds.cfg covers MaxAttempts = 2 without them).
\* Invariants expected to hold, checked together with --stop-at-first (a completed run = they hold in the bounded space).
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  MaxAttempts = 1
  NodeLimit = 1
  MaxToken = 2
  QueueOps = TRUE
  NULL = NULL
CONSTRAINT StateBound
INVARIANTS
  TypeInv
  Inv_SingleClaim
  Inv_NoDeleteProcessing
  Inv_RequeueOnlyFinished
  Scn_HealthyNotRecovered
  Scn_NoSecondClaim
  Scn_CancelledNotPromoted
  Scn_PausedNotDrained
  Scn_StaleCannotComplete
  Inv_NodeClaims
  Inv_StaleRunsFenced
  Scn124_TimedOutNotReleased
  Chk_NoCancelLeftAtStop
