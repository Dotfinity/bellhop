\* Run 4 gap probe: a cancel-requested job at its last attempt left behind by a draining node (hosting REQ-29) is dead-lettered by lease expiry instead of cancelled (run 4: VIOLATED, F-1). Run 5: still VIOLATED, only when the cancel arrives after the node stopped (accepted); the F-1 check is Chk_NoCancelLeftAtStop in Jobs_Holds/Jobs_HoldsQ. MaxAttempts = 1.
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  MaxAttempts = 1
  NodeLimit = 1
  MaxToken = 2
  QueueOps = FALSE
  NULL = NULL
CONSTRAINT StateBound
INVARIANTS
  TypeInv
  Gap_CancelledDeadLetteredAfterDrain
