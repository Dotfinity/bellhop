SPECIFICATION Spec
CONSTANTS
  Jobs = {j1, j2}
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  MaxAttempts = 2
  NodeLimit = 1
  MaxToken = 2
  QueueOps = FALSE
  NULL = NULL
CONSTRAINT StateBound
INVARIANTS
  TypeInv
  Gap_LeaseLostUnrecorded
