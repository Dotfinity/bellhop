\* Run 3 gap probe (F-2): a lease-lost handler whose job finished without a new lease token is never recorded by REQ-191 while its node claims again (run 3: VIOLATED; run 4: expected to PASS). Two job slots. Run 4: holds by construction (REQ-191's new trigger is the complement of Current); the full two-slot space does not finish in 170 s even at MaxAttempts = 1, MaxToken = 1, so this cfg is no longer in run_all.sh.
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1, j2}
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  MaxAttempts = 2
  NodeLimit = 1
  MaxToken = 2
  QueueOps = FALSE
  NULL = NULL
CONSTRAINT StateBound
INVARIANTS
  TypeInv
  Gap_LeaseLostUnrecorded
