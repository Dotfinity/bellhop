\* Run 7 probe: a late cancellation (after the shutdown token, before the node's check) whose lease expires first is dead-lettered by a recovering node at the last attempt (REQ-133) while its draining node still holds the run (expected VIOLATED = reachable; accepted race). MaxAttempts = 1.
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  MaxAttempts = 1
  NodeLimit = 1
  MaxToken = 2
  QueueOps = FALSE
  NULL = NULL
CONSTRAINT StateBound
INVARIANTS
  TypeInv
  Reach_LateLeaseExpiryFirst
