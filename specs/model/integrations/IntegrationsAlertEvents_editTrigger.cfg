\* Run-4 F-22 re-check: a developer edits the rule's trigger from dead-letters to missed occurrences and
\* keeps its name (REQ-410). INV-413 knows the rule by its name and event settings, so the edited rule starts
\* at the store's present.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  EditKind = "trigger"
  AllowPause = FALSE
  MaxChanges = 1
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "split"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = FALSE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
