\* F-22: a developer edits the rule's trigger from dead-letters to missed occurrences and keeps its
\* name (REQ-410). INV-413 knows the rule by name, so it does not start again.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  MaxChanges = 1
  RuleStart = "firstSeen"
  RuleKey = "name"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
