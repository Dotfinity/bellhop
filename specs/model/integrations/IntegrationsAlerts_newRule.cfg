\* INV-413 for a new rule, as written: the read, then a write that checks the lease and that the store
\* still has no record of the rule (run-4 F-20 re-check). Bounds as IntegrationsAlerts.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {a1, a2}
  AlertNodes = {a1, a2}
  WorkerNodes = {a1}
  Events = {e1, e2}
  EventTracking = "storeCursor"
  MaxCrashes = 1
  MaxPauses = 1
  RuleKnownAtStart = FALSE
  NewVersionNodes = {}
  MarkScope = "split"
  DeliveryWrite = "conditional"
  FirstWrite = "conditional"
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Scn405_NoLeaseNoDelivery
PROPERTIES
  Liv_EventAlerted
