\* Counterfactual (run 4's wording, F-22): INV-413 knows the rule by its name only, so an edited trigger
\* does not start the rule again and the stored backlog of the new trigger is alerted.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  EditKind = "trigger"
  AllowPause = FALSE
  MaxChanges = 1
  RuleStart = "firstSeen"
  RuleKey = "nameOnly"
  MarkScope = "split"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = FALSE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
