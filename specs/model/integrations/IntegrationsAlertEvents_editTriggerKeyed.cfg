\* F-22 option 1: INV-413 knows a rule by its name and the settings that decide its events, so an
\* edited trigger starts at the store's present.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  MaxChanges = 1
  RuleStart = "firstSeen"
  RuleKey = "nameAndTrigger"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
