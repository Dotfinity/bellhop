\* Main run: the requirements as written (INV-412, INV-413 by name and event settings, marks likewise,
\* recurring REQ-242 miss records). The rule is configured from the start on a store that already knows other
\* rules; a job is dead-lettered, requeued (jobs REQ-141) and dead-lettered again; the recurring job's missed
\* instants are recorded by a trigger, a schedule change or (run 6) a pause, and it may be resumed.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = FALSE
  AllowEdit = FALSE
  EditKind = "trigger"
  AllowPause = TRUE
  MaxChanges = 0
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perSettings"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = FALSE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
