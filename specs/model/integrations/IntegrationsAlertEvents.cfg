\* Main run: the requirements as written (INV-412, INV-413 by name, recurring REQ-242 miss records).
\* The rule is configured from the start on a store that already knows other rules; a job is dead-lettered,
\* requeued (jobs REQ-141) and dead-lettered again; two triggers each find a missed instant.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = FALSE
  AllowEdit = FALSE
  MaxChanges = 0
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perName"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
