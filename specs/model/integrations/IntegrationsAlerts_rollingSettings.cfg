\* Run 7: a rolling deploy that changes a threshold or tolerance. a1 runs the version the store records
\* ("A"), a2 the edited one ("B", same name, same events). The lease moves between them across a crash or
\* a pause; every write is a read and a later conditional write. As written: "delivered" per name.
SPECIFICATION Spec
CONSTANTS
  Nodes = {a1, a2}
  AlertNodes = {a1, a2}
  WorkerNodes = {a1}
  Events = {e1, e2}
  EventTracking = "storeCursor"
  MaxCrashes = 1
  MaxPauses = 1
  RuleKnownAtStart = TRUE
  NewVersionNodes = {a2}
  MarkScope = "split"
  DeliveryWrite = "conditional"
  FirstWrite = "conditional"
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Scn405_NoLeaseNoDelivery
PROPERTIES
  Liv_EventAlerted
