\* INV-402: internal is private and on the allowlist only through a wildcard entry (e.g. *.corp):
\* it must be refused (REQ-434), while api (public, also wildcard-only) may be called.
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Hosts = {api, internal}
  Allowlist = {api, internal}
  WildcardOnly = {api, internal}
  Private = {internal}
  MaxAttempts = 2
  MaxRedirects = 0
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_AllowlistOnly
  Inv_NoPrivate
