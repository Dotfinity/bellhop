  AllowRemove = FALSE
  AllowEdit = TRUE
  MaxChanges = 2
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perName"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Chk_WatchedDeadLetterAlertedOnReturn
