\* Run-5 F-23 re-check: the rule's trigger is edited (dead-letters -> missed occurrences) and then put
\* back: a rollback, or a rolling deploy whose lease moves from a node with the new version back to one
\* with the old. As written: records and handled marks per name and event settings. Both edits are fair
\* (SpecEditBack).
SPECIFICATION SpecEditBack
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  EditKind = "trigger"
  AllowPause = FALSE
  MaxChanges = 2
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perSettings"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = FALSE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Chk_WatchedDeadLetterAlertedOnReturn
