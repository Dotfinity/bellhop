\* Run 5: the rule's trigger is edited (dead-letters -> missed occurrences) and then put back: a rollback,
\* or a rolling deploy whose lease moves from a node with the new version back to one with the old.
\* INV-413 as written (records by name and event settings, kept). Handled marks per rule name: one
\* reading of "handled for that rule". Both edits are fair (SpecEditBack).
SPECIFICATION SpecEditBack
