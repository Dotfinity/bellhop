\* F-20: INV-413 for a new rule as written: the holder reads "no record", then writes, and the write
\* checks neither the lease nor that the name is still unrecorded. INV-412's write is one conditional step
\* here, so only INV-413's write is in question. Bounds as IntegrationsAlerts.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {a1, a2}
  AlertNodes = {a1, a2}
  WorkerNodes = {a1}
  Events = {e1, e2}
  EventTracking = "storeCursor"
  MaxCrashes = 1
  MaxPauses = 1
  RuleKnownAtStart = FALSE
  DeliveryWrite = "conditional"
  FirstWrite = "literal"
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Scn405_NoLeaseNoDelivery
PROPERTIES
  Liv_EventAlerted
