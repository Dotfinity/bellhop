\* F-18 reading: the rule is added after events happened and treats every event still in the store as not
\* yet handled. Missed instants recorded durably.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = FALSE
  RuleStart = "storeStart"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
