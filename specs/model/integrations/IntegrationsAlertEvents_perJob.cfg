\* F-19 reading: the handled mark is attached to the job, and the job is dead-lettered twice (requeued in
\* between, jobs REQ-141). Missed instants recorded durably so that only the mark key differs.
SPECIFICATION Spec
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  RuleStart = "ruleAdded"
  MarkKey = "perJob"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
