\* Run 7: the rule's threshold or tolerance is edited once and never put back (an ordinary deploy). The
\* rule has been running. As written. The edit is not fair: it may or may not happen. Run 8: Liv_* check
\* INV-412's "skips one after its start (INV-413)"; Chk_*AcrossVersions is run 7's name-wide reading, whose
\* failure INV-413's notes accept (run 7 F-25).
SPECIFICATION Spec
