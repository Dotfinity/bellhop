  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  EditKind = "settings"
  AllowPause = FALSE
  MaxChanges = 1
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "split"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = TRUE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
PROPERTIES
  Chk_DeadLetterAlertedAcrossVersions
  Chk_MissedAlertedAcrossVersions
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
