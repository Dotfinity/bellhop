\* Main run. Allowlist has api (public) and internal (private address, listed by its own name);
\* meta is the cloud metadata address (private, not allowlisted).
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Hosts = {api, internal, meta}
  Allowlist = {api, internal}
  WildcardOnly = {}
  Private = {internal, meta}
  MaxAttempts = 2
  MaxRedirects = 0
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_AllowlistOnly
  Inv_NoPrivate
  Inv_Redirects
  Inv_NoPayloadCredentials
  Scn401_RefusedOffAllowlist
  Chk_NoPayloadSecretAtAll
  Probe_RedirectOneRule
