\* Main run. Allowlist has api (public) and internal (private address); meta is the cloud metadata address (private, not allowlisted).
SPECIFICATION Spec
CONSTANTS
  Jobs = {j1}
  Hosts = {api, internal, meta}
  Allowlist = {api, internal}
  Private = {internal, meta}
  ExplicitPrivate = {}
  MaxAttempts = 2
  MaxRedirects = 0
  Inv408Scope = "application"
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_AllowlistOnly
  Inv_NoPrivate
  Inv_Redirects
  Inv_NoPayloadCredentials
  Scn401_RefusedOffAllowlist
