\* Run 6: the rule's threshold or tolerance is edited (it keeps watching the same events) and then put
\* back, by a rollback or a rolling deploy whose lease moves back to an old-version node; the rule has been
\* running, so the store records its original version (RecordedAtStart). As written:
\* records and marks per name and event settings. Both edits are fair (SpecEditBack).
SPECIFICATION SpecEditBack
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = FALSE
  AllowEdit = TRUE
  EditKind = "settings"
  AllowPause = FALSE
  MaxChanges = 2
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perSettings"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = TRUE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
PROPERTIES
  Chk_WatchedDeadLetterAlertedOnReturn
