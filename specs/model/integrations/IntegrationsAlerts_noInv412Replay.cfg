\* Counterfactual: INV-412 dropped, EventTracking = "nodeReplay" (each node keeps what it handled in its own
\* memory; run 2's F-15 reading). Same bounds as IntegrationsAlerts.cfg. Shows that INV-412 carries the guarantee.
SPECIFICATION Spec
CONSTANTS
  Nodes = {a1, a2}
  AlertNodes = {a1, a2}
  WorkerNodes = {a1}
  Events = {e1, e2}
  EventTracking = "nodeReplay"
  MaxCrashes = 1
  MaxPauses = 1
  RuleKnownAtStart = TRUE
  NewVersionNodes = {}
  MarkScope = "split"
  DeliveryWrite = "conditional"
  FirstWrite = "conditional"
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Scn405_NoLeaseNoDelivery
PROPERTIES
  Liv_EventAlerted
