\* INV-413 notes: the rule is removed and added back (or a rolling deploy moves the lease to a node
\* without it and back); its record and marks are kept by name. The re-add is fair here (SpecReadd).
SPECIFICATION SpecReadd
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = TRUE
  AllowEdit = FALSE
  MaxChanges = 2
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perName"
  MarkKey = "perChange"
  MissRecord = "durable"
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
