\* INV-413 notes: the rule is removed and added back (or a rolling deploy moves the lease to a node without
\* it and back); its records and marks are kept. The re-add is fair here (SpecReadd).
SPECIFICATION SpecReadd
CONSTANTS
  SameJob = TRUE
  RuleAtStart = TRUE
  OtherRuleKnown = TRUE
  InitialWatch = {"dl", "miss"}
  AllowRemove = TRUE
  AllowEdit = FALSE
  EditKind = "trigger"
  AllowPause = FALSE
  MaxChanges = 2
  RuleStart = "firstSeen"
  RuleKey = "nameAndSettings"
  MarkScope = "perSettings"
  MarkKey = "perChange"
  MissRecord = "durable"
  RecordedAtStart = FALSE
INVARIANTS
  TypeInv
  Inv_OneDeliveryPerEvent
  Chk_NoAlertForEventBeforeRule
PROPERTIES
  Liv_DeadLetterAlerted
  Liv_MissedAlerted
