\* LIV-500 with one worker node (n1) and one client-only node (n2); hosts may stop nodes.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  WorkerNodes = {n1}
  Jobs = {j1}
  QueueA = {j1}
  KeyMax = 1
  NULL = NULL
  ShardByQueue = FALSE
  FreshStore = FALSE
  LossKinds = {"flush"}
  MaxLosses = 1
  AllowStop = TRUE
  CheckHealth = FALSE
  MaxOutages = 1
  MemToggle = FALSE
INVARIANTS
  TypeInv
PROPERTIES
  Liv_Reseeded
