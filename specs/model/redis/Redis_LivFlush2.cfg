\* Liveness run: two worker nodes, one job, up to two FLUSHALLs (a flush during reconciliation).
\* Driven by run_all.py: each invariant once with --stop-at-first; liveness is in Redis_Liveness*.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  Jobs = {j1}
  QueueA = {j1}
  KeyMax = 1
  NULL = NULL
  ShardByQueue = FALSE
  FreshStore = FALSE
  LossKinds = {"flush"}
  MaxLosses = 2
  AllowStop = FALSE
  CheckHealth = FALSE
  MaxOutages = 1
  MemToggle = FALSE
INVARIANTS
  TypeInv
PROPERTIES
  Liv_LossReported
