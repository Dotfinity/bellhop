\* Flush-only run: as Redis.cfg but FLUSHALL is the only data-loss event (REQ-522 is about a generation change).
\* Driven by run_all.py: each invariant once with --stop-at-first; liveness is in Redis_Liveness*.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  Jobs = {j1, j2}
  QueueA = {j1}
  KeyMax = 1
  NULL = NULL
  ShardByQueue = FALSE
  FreshStore = FALSE
  LossKinds = {"flush"}
  MaxLosses = 2
  AllowStop = FALSE
  CheckHealth = FALSE
  MaxOutages = 1
  MemToggle = FALSE
INVARIANTS
  TypeInv
  Inv_NoLostOutcome
  Inv_ConcurrencyKeyMax
  Inv_SingleClaim
