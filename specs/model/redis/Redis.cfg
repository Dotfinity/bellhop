\* Main run (store resets vs jobs): two worker nodes, established store, flush + eviction, ShardByQueue on.
\* Driven by run_all.py: each invariant once with --stop-at-first; liveness is in Redis_Liveness*.cfg.
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  WorkerNodes = {n1, n2}
  Jobs = {j1, j2}
  QueueA = {j1}
  KeyMax = 1
  NULL = NULL
  ShardByQueue = TRUE
  FreshStore = FALSE
  LossKinds = {"flush", "evict"}
  MaxLosses = 2
  AllowStop = FALSE
  CheckHealth = FALSE
  MaxOutages = 1
  MemToggle = FALSE
INVARIANTS
  TypeInv
  Inv_NoFalseReset
  Inv_OneEventPerReset
  Inv_NoLostOutcome
  Inv_UnackedUntilOperator
  Inv_ConcurrencyKeyMax
  Inv_SingleClaim
  Inv_UniqueKeyPerNamespace
  Inv_MaintenanceOnlyOperatorOff
  Scn_NoEvalNoReady
