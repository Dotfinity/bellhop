\* Two nodes sharing one store: concurrent starts, migration lock, rolling deploy.
\*   python run_tlc.py Hosting.tla --config Hosting_2N.cfg --out run_2N.json --md run_2N.md
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1, n2}
  Versions = {0, 1, 2, 3}
  ExpectedVals = {2, 3}
  InitSchemaVals = {0, 1}
  InitReachVals = {TRUE}
  RegVals = {"worker"}
  AutoVals = {TRUE, FALSE}
  ValidVals = {TRUE, FALSE}
  ToolVals = {FALSE}
  ConfVals = {TRUE}
  DevVals = {FALSE}
  AlertVals = {FALSE}
  OkVals = {TRUE, FALSE}
  MaxInFlight = 1
  HealthyAfterPasses = 2
  HealthEnv = FALSE
  NULL = NULL
INVARIANTS
  TypeInv
  Chk_NoMigrationWithInvalidOptions
