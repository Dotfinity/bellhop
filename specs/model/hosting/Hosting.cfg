\* Main run (single node, startup + shutdown, health checks without environment noise):
\*   python run_tlc.py Hosting.tla --out run.json --md run.md
SPECIFICATION Spec
CONSTANTS
  Nodes = {n1}
  Versions = {0, 1, 2, 3}
  ExpectedVals = {2, 3}
  InitSchemaVals = {0, 1, 2, 3}
  InitReachVals = {TRUE, FALSE}
  RegVals = {"none", "client", "worker"}
  AutoVals = {TRUE, FALSE}
  ValidVals = {TRUE, FALSE}
  ToolVals = {TRUE, FALSE}
  ConfVals = {TRUE, FALSE}
  DevVals = {TRUE, FALSE}
  AlertVals = {TRUE, FALSE}
  OkVals = {TRUE, FALSE}
  MaxInFlight = 1
  HealthyAfterPasses = 2
  HealthEnv = FALSE
  NULL = NULL
INVARIANTS
  TypeInv
  Inv_NoIOBeforeHostStart
  Inv_NoWorkerInBuildTooling
  Inv_InMemoryWhenNoStore
  Inv_NoJobsWithoutWorker
  Inv_NoDutiesWithoutWorker
  Scn_InvalidOptionNeverClaims
  Scn_SchemaMismatchBlocksRunning
  Chk_NoRunningAfterHostStop
  Chk_NoClaimAfterHostStop
  Chk_MigrateBeforeRunning
  Chk_ReconcileOnAcceptedSchema
  Chk_NoMigrationWithInvalidOptions
  Chk_LockHolderStarting
  Chk_OneMemoryWarning
  Chk_MemoryWarningBeforeRunning
PROPERTIES
  Prop_MigrationIdempotent
  Prop_MigrateOnlyUnderLock
  Chk_DrainEnds
